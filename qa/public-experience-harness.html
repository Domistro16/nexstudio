<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio Public Experience QA</title><link rel="stylesheet" href="../app/studio-v1.css"><style>html,body{margin:0}.qa-note{font:600 .62rem/1.3 SFMono-Regular,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--sv1-quiet);padding:.35rem .55rem;border:1px solid var(--sv1-line);border-radius:999px}.qa-screen{min-height:100vh}.qa-surface{display:none}.qa-surface.active{display:block}.qa-film-empty{aspect-ratio:16/9;background:#050505;border:1px solid var(--sv1-line);border-radius:var(--sv1-radius-xl)}.qa-steps{display:flex;gap:.55rem;flex-wrap:wrap}.qa-tour-fade{transition:opacity 220ms var(--sv1-ease)}.qa-tour-fade.is-changing{opacity:.15}</style></head><body><div class="studio-v1-boundary qa-screen"><div id="app"></div></div><script>
const surfaces={
home:()=>`<div class="sv1-root sv1-calm qa-surface active"><header class="sv1-header"><button class="sv1-wordmark" aria-label="Studio home"><i aria-hidden="true">·</i><span>Studio</span></button><nav aria-label="Studio navigation"><button data-go="work">Work</button><button data-go="pricing">Pricing</button><button>Sign in</button><button class="sv1-primary small">Create</button></nav></header><main class="sv1-public-main"><section class="sv1-hero"><div class="sv1-hero-copy"><p class="sv1-kicker">Creative production</p><h1>Make something worth watching.</h1><p>Tell us what you want. Studio keeps the brief, develops a complimentary plan, gives you the exact price, and brings the finished film back for review.</p></div><div class="sv1-composer"><label for="qa-prompt">What do you want to make?</label><textarea id="qa-prompt" rows="5" aria-label="What do you want to make?"></textarea><div class="sv1-composer-actions"><span class="sv1-quiet">Files, links and reference media can be attached inside the production.</span><div class="sv1-inline-actions"><button class="sv1-primary" data-go="family">Choose a type</button></div></div></div></section><section class="sv1-family-section"><div class="sv1-section-head"><p class="sv1-kicker">Starting points</p><h2>Four ways to make the idea move.</h2><p>Choose a family. Starting points appear here only when they are ready for public production.</p></div>${familyIndex()}</section>${how()}</main></div>`,
family:()=>`<div class="sv1-root sv1-calm qa-surface active"><header class="sv1-header"><button class="sv1-wordmark" data-go="home" aria-label="Studio home"><i aria-hidden="true">·</i><span>Studio</span></button><nav aria-label="Studio navigation"><button data-go="work">Work</button><button data-go="pricing">Pricing</button><button>Sign in</button><button class="sv1-primary small" data-go="home">Create</button></nav></header><main class="sv1-public-main sv1-family-page"><button class="sv1-back" data-go="home">← All production families</button><div class="sv1-section-head large"><p class="sv1-kicker">Explainer</p><h1>Choose a starting point.</h1><p>Only production types with finished Studio-made work appear here.</p></div><div class="sv1-release-state"><p class="sv1-kicker">Not yet open</p><h2>No public explainer work is published yet.</h2><p>Studio opens a production type only when its finished-film standard is met. No borrowed footage or staged example is substituted.</p><button class="sv1-secondary" data-go="work">View Work</button></div></main></div>`,
work:()=>`<div class="sv1-root sv1-calm qa-surface active"><header class="sv1-header"><button class="sv1-wordmark" data-go="home" aria-label="Studio home"><i aria-hidden="true">·</i><span>Studio</span></button><nav aria-label="Studio navigation"><button aria-current="page">Work</button><button data-go="pricing">Pricing</button><button>Sign in</button><button class="sv1-primary small" data-go="home">Create</button></nav></header><main class="sv1-public-main sv1-editorial-page"><div class="sv1-section-head large"><p class="sv1-kicker">Work</p><h1>Finished films, not promises.</h1><p>Every film published here must come from the same production path customers use.</p></div><section class="sv1-release-state"><p class="sv1-kicker">Public gallery</p><h2>The gallery is intentionally empty.</h2><p>The public gallery opens with Studio-made films that meet the release standard. Until then, Studio leaves the space empty rather than borrowing footage or staging examples.</p><button class="sv1-primary" data-go="home">Start from the Studio</button></section></main></div>`,
pricing:()=>`<div class="sv1-root sv1-calm qa-surface active"><header class="sv1-header"><button class="sv1-wordmark" data-go="home" aria-label="Studio home"><i aria-hidden="true">·</i><span>Studio</span></button><nav aria-label="Studio navigation"><button data-go="work">Work</button><button aria-current="page">Pricing</button><button>Sign in</button><button class="sv1-primary small" data-go="home">Create</button></nav></header><main class="sv1-public-main sv1-editorial-page"><div class="sv1-section-head large"><p class="sv1-kicker">Pricing</p><h1>Pay for the finished duration.</h1><p>Planning comes first. The exact quote appears before paid production begins.</p></div><section class="sv1-price-hero"><span>Base video production</span><div><strong>$2</strong><small>per finished minute</small></div><p>All four launch families use the same base rate. A 30-second production is $1.00 before any eligible welcome rate; 60 seconds is $2.00.</p></section><div class="sv1-pricing-grid"><section><p class="sv1-kicker">Before payment</p><h2>Your complimentary plan.</h2><p>A bounded plan for deciding whether to proceed.</p></section><section><p class="sv1-kicker">Your quote</p><h2>Exact before you commit.</h2><p>The server calculates the duration price and eligible welcome rate.</p></section><section><p class="sv1-kicker">Revisions</p><h2>Same paid production.</h2><p>Requested changes remain in the same paid production and version lineage.</p></section></div></main></div>`,
brief:()=>workspace('calm',`<div class="sv1-production-identity"><span>Production</span><strong>Saved brief</strong></div><div class="sv1-room-head"><p class="sv1-kicker">Your brief</p><h1>Tell us what to make.</h1><p>Your first idea stays attached to this production from here forward.</p></div><div class="sv1-brief-grid"><section class="sv1-brief-main"><label for="brief">Your brief</label><textarea id="brief" rows="10"></textarea><div class="sv1-saved-line"><span>Saved brief</span><span>Price shown after plan</span></div></section><aside class="sv1-brief-options"><label>Length</label><strong>Auto</strong><label>Format</label><strong>Auto</strong><label>Voice</label><strong>Studio decides</strong></aside></div><details class="sv1-context-memory"><summary><span>Brand, Series, Cast & memory</span><small>Production context</small></summary><div class="sv1-context-memory-body"><div class="sv1-context-block"><div><strong>Production context</strong><p>Select the persistent context this production should use. These bindings lock when paid execution begins.</p></div><div class="sv1-context-grid"><label>Brand<select><option>No Brand</option></select></label><label>Series<select><option>No Series</option></select></label></div><fieldset><legend>Cast</legend><div class="sv1-cast-choices"><p>No reusable characters saved yet.</p></div></fieldset><button class="sv1-secondary">Save production context</button></div><div class="sv1-context-block"><div><strong>Remember from here</strong><p>Choose where this instruction should apply. Earlier delivered versions never change.</p></div><div class="sv1-context-grid"><label>Apply to<select><option>This production only</option></select></label></div><label>Instruction<textarea rows="3" aria-label="Instruction"></textarea></label><button class="sv1-secondary" disabled>Remember instruction</button></div></div></details><div class="sv1-room-actions"><button class="sv1-secondary">Save</button><button class="sv1-primary" data-go="planning">Develop my video</button></div>`),
context:()=>surfaces.brief().replace('<details class="sv1-context-memory"','<details class="sv1-context-memory" open'),
auth:()=>`<div class="sv1-root sv1-calm qa-surface active"><header class="sv1-header"><button class="sv1-wordmark" aria-label="Studio home"><i aria-hidden="true">·</i><span>Studio</span></button><nav aria-label="Studio navigation"><button>Home</button></nav></header><main class="sv1-room"><div class="sv1-production-identity"><span>Production</span><strong>Saved brief</strong></div><div class="sv1-room-head"><p class="sv1-kicker">Your brief</p><h1>Tell us what to make.</h1><p>Your first idea stays attached to this production from here forward.</p></div></main><div class="sv1-modal-backdrop" role="presentation"><section class="sv1-modal" role="dialog" aria-modal="true" aria-labelledby="qa-auth-title"><button class="sv1-close" aria-label="Close sign in">×</button><p class="sv1-kicker">Your draft is already saved</p><h2 id="qa-auth-title">Keep this production.</h2><p>Sign in or create an account to continue. Nothing you entered will be lost.</p><div class="sv1-saved-preview"><span>Saved brief</span><p>Explain a new service clearly without losing the human story.</p><span class="sv1-info" tabindex="0">i<span>The exact total appears after the complimentary plan.</span></span></div><label class="sv1-visually-hidden" for="qa-auth-email">Email address</label><input id="qa-auth-email" type="email" inputmode="email" autocomplete="email" placeholder="Email address"><button class="sv1-primary full">Continue with email</button></section></div></div>`,
planning:()=>workspace('calm',`<div class="sv1-production-identity"><span>Production</span><strong>Saved brief</strong></div><section class="sv1-thinking" aria-busy="true"><div><p class="sv1-kicker">Complimentary plan</p><h1>Your brief is being developed.</h1><p>The brief is saved. This surface changes only when the real plan is ready or the Studio needs more information.</p></div></section>`),
plan:()=>workspace('calm',`<div class="sv1-production-identity"><span>Production</span><strong>Plan ready</strong></div><section class="sv1-plan"><div class="sv1-room-head"><p class="sv1-kicker">Production plan</p><h1>Here’s how the story will move.</h1><p>The production plan is persisted from the complimentary planning response.</p></div><div class="sv1-plan-beats"><article><time>0–15 sec</time><div><strong>Opening beat</strong><p>Customer-facing communication purpose from the persisted plan.</p></div></article><article><time>15–30 sec</time><div><strong>Development beat</strong><p>Customer-facing communication purpose from the persisted plan.</p></div></article></div><div class="sv1-room-actions"><button class="sv1-secondary">Adjust brief</button><button class="sv1-primary" data-go="quote">Approve plan</button></div></section>`),
quote:()=>workspace('calm',`<div class="sv1-production-identity"><span>Production</span><strong>Quote</strong></div><section class="sv1-payment"><div class="sv1-room-head"><p class="sv1-kicker">Ready to produce</p><h1>Start the production.</h1><p>You are charged only when you approve paid production.</p></div><div class="sv1-payment-card"><div><span>Production</span><strong>$2.00</strong></div><dl><div><dt>Finished duration</dt><dd>60s</dd></div><div><dt>Your balance</dt><dd>$5.00</dd></div></dl><div class="sv1-room-actions"><button class="sv1-primary" data-go="production">Approve & produce</button></div></div></section>`),
lowbalance:()=>workspace('calm',`<div class="sv1-production-identity"><span>Production</span><strong>Balance</strong></div><section class="sv1-payment"><div class="sv1-room-head"><p class="sv1-kicker">Ready to produce</p><h1>Add balance, then continue.</h1><p>Your approved plan and this exact production remain saved.</p></div><div class="sv1-payment-card"><div><span>Production</span><strong>$2.00</strong></div><dl><div><dt>Finished duration</dt><dd>60s</dd></div><div><dt>Your balance</dt><dd>$0.50</dd></div><div><dt>Amount needed</dt><dd>$1.50</dd></div></dl><div class="sv1-room-actions"><button class="sv1-primary">Add balance & continue</button></div></div></section>`),
production:()=>workspace('production',`<div class="sv1-production-identity"><span>Production</span><strong>In production</strong></div><section class="sv1-production-room"><div class="sv1-room-head"><p class="sv1-kicker">Production</p><h1>Production is underway.</h1><p>The approved plan and paid production are secure. Status shown here comes from the production workflow.</p></div><div class="sv1-stage-line" aria-label="Production stages"><span class="done">Paid</span><span class="done">Direction</span><span class="active">Performance</span><span>Sound</span><span>Review</span><span>Final film</span></div><div class="sv1-production-evidence"><strong>In production</strong><span>No percentage or finish time is invented.</span></div></section>`),
screening:()=>workspace('production',`<div class="sv1-production-identity"><span>Production</span><strong>Final review</strong></div><section class="sv1-review-room"><div class="sv1-review-heading"><div class="sv1-room-head"><p class="sv1-kicker">Screening room</p><h1>Watch the finished film.</h1><p>Approve the current version, download it, or request a precise change.</p></div><div class="sv1-version-control"><label for="version">Version</label><select id="version"><option>v2 · current</option><option>v1</option></select></div></div><div class="qa-film-empty" aria-label="Persisted production output surface"></div><div class="sv1-room-actions sv1-review-actions"><button class="sv1-secondary">Download v2</button><button class="sv1-secondary" data-go="revision">Request changes</button><button class="sv1-primary">Approve current version</button></div></section>`),
historical:()=>workspace('production',`<div class="sv1-production-identity"><span>Production</span><strong>Final review</strong></div><section class="sv1-review-room"><div class="sv1-review-heading"><div class="sv1-room-head"><p class="sv1-kicker">Screening room</p><h1>Compare an earlier version.</h1><p>Earlier films stay available without moving approval or revision authority away from the current version.</p></div><div class="sv1-version-control"><label for="historical-version">Version</label><select id="historical-version"><option>v1</option><option>v2 · current</option></select></div></div><div class="qa-film-empty" aria-label="Persisted historical production output surface"></div><div class="sv1-version-note" role="status"><span>Viewing v1</span><p>Approval and revisions stay attached to the current version.</p><button class="sv1-secondary">Return to v2</button></div></section>`),
revision:()=>workspace('production',`<div class="sv1-production-identity"><span>Production</span><strong>Final review</strong></div><section class="sv1-review-room"><div class="sv1-review-heading"><div class="sv1-room-head"><p class="sv1-kicker">Screening room</p><h1>Request a precise change.</h1><p>The current version remains available while the requested revision is attached to this paid production.</p></div><div class="sv1-version-control"><label for="version2">Version</label><select id="version2"><option>v2 · current</option><option>v1</option></select></div></div><div class="qa-film-empty" aria-label="Persisted production output surface"></div><div class="sv1-revision-panel"><div><label for="time">Timestamp <span>optional</span></label><input id="time" inputmode="decimal"></div><div class="wide"><label for="note">What should change?</label><textarea id="note" rows="3"></textarea></div><button class="sv1-primary">Send changes</button><p class="sv1-quiet wide">The next finished film becomes a new version; earlier versions stay in history.</p></div></section>`)
};
function familyIndex(){return `<div class="sv1-family-index">${[['01','Explainer','Make a product, process, system or idea easy to understand.'],['02','Whiteboard','Build the explanation as the viewer watches it unfold.'],['03','Stickman','Tell the story through simple characters, actions and scenes.'],['04','Editorial Motion','Use words, graphics, rhythm and sound to carry the idea.']].map(x=>`<button class="sv1-family-index-row" data-go="family"><span class="sv1-family-number">${x[0]}</span><span><strong>${x[1]}</strong><small>${x[2]}</small></span><span class="sv1-family-arrow" aria-hidden="true">↗</span></button>`).join('')}</div>`}
function how(){return `<section class="sv1-how"><p class="sv1-kicker">How it works</p><div><strong>Describe it.</strong><span>Your original prompt stays with the same production.</span></div><div><strong>Approve the plan.</strong><span>See the plan and exact quote before paid production.</span></div><div><strong>Review the film.</strong><span>Approve, download or request a revision.</span></div></section>`}
function workspace(env,content){return `<div class="sv1-root ${env==='production'?'sv1-production':'sv1-calm'} qa-surface active" data-environment="${env}"><header class="sv1-header"><button class="sv1-wordmark" data-go="home" aria-label="Studio home"><i aria-hidden="true">·</i><span>Studio</span></button><nav aria-label="Studio navigation"><button>Dashboard</button></nav></header><main class="sv1-room">${content}</main></div>`}
const app=document.getElementById('app');function render(name){app.classList.add('qa-tour-fade','is-changing');setTimeout(()=>{app.innerHTML=(surfaces[name]||surfaces.home)();app.classList.remove('is-changing');bind();},90)}function bind(){document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>render(el.dataset.go)))}
const q=new URLSearchParams(location.search);render(q.get('surface')||'home');
if(q.get('tour')==='public'){const seq=['home','family','work','pricing','home'];let i=0;setInterval(()=>render(seq[(++i)%seq.length]),1800)}
if(q.get('tour')==='workspace'){const seq=['brief','planning','plan','quote','production','screening','revision','screening'];let i=0;setInterval(()=>render(seq[(++i)%seq.length]),1600)}
</script></body></html>
