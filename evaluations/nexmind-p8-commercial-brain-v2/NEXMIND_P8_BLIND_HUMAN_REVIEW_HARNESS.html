<!doctype html><html><head><meta charset="utf-8"><title>NexMind P8 Blind Creative Review</title><style>body{font-family:system-ui;max-width:980px;margin:40px auto;padding:0 24px;background:#111;color:#eee}h1{font-size:28px}p{color:#bbb;line-height:1.55}.g{display:grid;grid-template-columns:1fr 120px;gap:10px 18px;margin:28px 0}.g label{padding:10px 0;border-bottom:1px solid #333}.g input{width:100px;background:#191919;color:#fff;border:1px solid #444;border-radius:8px;padding:8px}textarea,input[type=text]{background:#191919;color:#fff;border:1px solid #444;border-radius:8px;padding:10px}button{padding:12px 18px;border:0;border-radius:10px;font-weight:700}.warn{padding:14px;border:1px solid #694;background:#18160d}.meta{display:grid;gap:12px}.out{white-space:pre-wrap;background:#181818;padding:16px;border-radius:10px;margin-top:20px}</style></head><body><h1>Blind Creative Review</h1><p>This harness intentionally hides internal Director names, candidate labels, mechanism families, test status and machine scores. Review the finished film/contact sheet/audio as a client-facing work.</p><div class="warn">A machine PASS is not shown here. Your job is independent creative judgment.</div><div class="meta"><label>Reviewer ID <input id="rid" type="text"></label><label>Reviewer provenance <input id="prov" type="text" placeholder="role / studio / relationship"></label></div><div id="scores" class="g"></div><label>Hard rejects (one per line)<br><textarea id="hard" rows="5" style="width:100%"></textarea></label><br><br><label>Notes<br><textarea id="notes" rows="6" style="width:100%"></textarea></label><br><br><button onclick="emit()">Export review JSON</button><div id="out" class="out"></div><script>const dims=['story_clarity','visual_communication','illustration_art_quality','character_subject_storytelling','visual_hierarchy','originality_appropriateness','continuity_transformation','motion_intentionality','cinematography','editorial_rhythm','sound_design','beauty_composition_taste','charm_appeal','emotional_appropriateness','final_payoff','commercial_believability'];scores.innerHTML=dims.map(d=>`<label>${d.replaceAll('_',' ')}</label><input id="s_${d}" type="number" min="0" max="10" step="0.1">`).join('');function emit(){const sc={};for(const d of dims)sc[d]=Number(document.getElementById('s_'+d).value);const x={reviewer_id:rid.value,reviewer_provenance:prov.value,blind:true,independent:true,scores:sc,hard_rejects:hard.value.split('\n').map(x=>x.trim()).filter(Boolean),notes:notes.value};out.textContent=JSON.stringify(x,null,2)}</script></body></html>
